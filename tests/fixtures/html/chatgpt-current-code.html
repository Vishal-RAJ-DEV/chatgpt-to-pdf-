<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Python Code Snippet - ChatGPT</title>
</head>
<body>
  <div id="__next">
    <main class="relative h-full w-full flex-1 overflow-hidden">
      <div data-testid="conversation-turns-container">
        <!-- Turn 1: User -->
        <article data-testid="conversation-turn-1" data-message-author-role="user">
          <div class="user-message-content whitespace-pre-wrap">Write a Python script to calculate Fibonacci numbers.</div>
        </article>

        <!-- Turn 2: Assistant -->
        <article data-testid="conversation-turn-2" data-message-author-role="assistant">
          <div class="agent-turn">
            <div class="markdown prose">
              <p>Here is a simple recursive function to calculate Fibonacci numbers in Python:</p>
              <div class="bg-black rounded-md">
                <div class="flex items-center justify-between px-4 py-1.5 text-xs text-gray-200 bg-gray-800">
                  <span>python</span>
                  <button class="flex gap-1 items-center copy-code-button">
                    <svg class="h-4 w-4"></svg>
                    Copy code
                  </button>
                </div>
                <div class="p-4 overflow-y-auto">
                  <pre><code class="language-python">def fibonacci(n):
    if n <= 0:
        return 0
    elif n == 1:
        return 1
    return fibonacci(n - 1) + fibonacci(n - 2)

print(fibonacci(10))</code></pre>
                </div>
              </div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>
