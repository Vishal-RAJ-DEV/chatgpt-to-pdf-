<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comparison Table - ChatGPT</title>
</head>
<body>
  <div id="__next">
    <main class="relative h-full w-full flex-1 overflow-hidden">
      <div data-testid="conversation-turns-container">
        <!-- Turn 1: User -->
        <article data-testid="conversation-turn-1" data-message-author-role="user">
          <div class="user-message-content">Compare Python and JavaScript.</div>
        </article>

        <!-- Turn 2: Assistant -->
        <article data-testid="conversation-turn-2" data-message-author-role="assistant">
          <div class="agent-turn">
            <div class="markdown prose">
              <p>Here is a comparison table between Python and JavaScript:</p>
              <table>
                <thead>
                  <tr>
                    <th>Feature</th>
                    <th>Python</th>
                    <th>JavaScript</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Type System</td>
                    <td>Dynamic, Strong</td>
                    <td>Dynamic, Weak</td>
                  </tr>
                  <tr>
                    <td>Primary Use Case</td>
                    <td>Backend, AI/ML, Data Science</td>
                    <td>Web Frontend, Node.js Backend</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>
</body>
</html>
